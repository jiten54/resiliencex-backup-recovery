apiVersion: v1
kind: ConfigMap
metadata:
  name: resiliencex-config
  namespace: resiliencex
data:
  POSTGRES_SERVER: "postgres.resiliencex.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "resiliencex"
  REDIS_HOST: "redis.resiliencex.svc.cluster.local"
  REDIS_PORT: "6379"
  STORAGE_BACKEND: "s3"
  S3_BUCKET_NAME: "resiliencex-enterprise-backups"
  AWS_REGION: "us-east-1"
  WORKER_LEASE_SECONDS: "15"
  WORKER_HEARTBEAT_SECONDS: "3"
